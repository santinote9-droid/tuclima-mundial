{% extends 'base.html' %}

{% block title %}Iniciar Sesión | TuClima{% endblock %}

{% block extra_head %}
<style>
        /* MISMOS ESTILOS QUE EL REGISTRO PARA COHERENCIA */
        html { overflow-x: hidden; }
        body {
            background-color: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            padding: 16px; box-sizing: border-box;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 80%);
        }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .card {
            background: #1e293b; padding: 40px; border-radius: 20px; border: 1px solid #334155;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .brand { text-align: center; font-size: 1.8rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }
        .brand span { color: #3b82f6; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 1.1rem; color: #94a3b8; font-weight: normal; }
        
        form { display: flex; flex-direction: column; gap: 20px; }
        label { display: none; } /* En login podemos ocultar labels y usar placeholders si queremos, o dejarlos */
        
        input {
            width: 100%; padding: 15px; background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; color: #fff; font-size: 1rem; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }

        .campo-clave { position: relative; }
        .campo-clave input { padding-right: 48px; }
        .campo-clave .ver-clave {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; min-height: 40px; margin: 0; padding: 0;
            background: transparent; color: #94a3b8; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: normal; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .campo-clave .ver-clave:hover { background: transparent; color: #e2e8f0; box-shadow: none; }

        button {
            width: 100%; padding: 15px; background: #22c55e; color: #000; border: none;
            border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #16a34a; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }

        .bottom-link { text-align: center; margin-top: 25px; font-size: 0.9em; color: #94a3b8; }
        .bottom-link a { color: #22c55e; text-decoration: none; font-weight: bold; }

        /* Responsive: tablet ≤900 | móvil ≤600 */
        @media (max-width: 900px) {
            .card { padding: 32px 24px; }
        }
        @media (max-width: 600px) {
            body { align-items: flex-start; padding: 24px 12px 40px; }
            .container { padding: 0; }
            .card { padding: 24px 18px; border-radius: 14px; }
            .brand { font-size: 1.5rem; margin-bottom: 20px; }
            input { font-size: 16px !important; padding: 14px; min-height: 48px; }
            button { padding: 14px; font-size: 0.95rem; min-height: 48px; }
            .campo-clave .ver-clave { width: 44px; height: 44px; min-height: 44px; padding: 0; font-size: 1.05rem; }
            h2 { font-size: 1rem; }
        }
    </style>
{% endblock %}

{% block content %}
<div class="container">
        <div class="card">
            <div class="brand notranslate"><i class="fas fa-cloud"></i> <span class="notranslate" translate="no">TuClima</span></div>
            <h2>Bienvenido de nuevo</h2>

            <form method="post">
                {% csrf_token %}
                
                <div>
                    <input type="text" name="username" placeholder="Usuario" required autofocus>
                </div>
                
                <div class="campo-clave">
                    <input type="password" name="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                    <button type="button" class="ver-clave" id="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>

                <button type="submit">Ingresar</button>
            </form>

            <div class="bottom-link">
                ¿No tienes cuenta? <a href="/registro/">Regístrate aquí</a>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var input = document.getElementById('password');
            var btn = document.getElementById('ver-clave');
            if (!input || !btn) return;
            var icon = btn.querySelector('i');
            btn.addEventListener('click', function () {
                var mostrar = input.type === 'password';
                input.type = mostrar ? 'text' : 'password';
                btn.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
                btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
                if (icon) {
                    icon.classList.toggle('fa-eye', !mostrar);
                    icon.classList.toggle('fa-eye-slash', mostrar);
                }
            });
        })();
    </script>
{% endblock %}
