{% if operabilidad %}
<div class="tc-op-badge" style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;margin-bottom:14px;border-radius:12px;border:1px solid {{ operabilidad.color }}55;background:{{ operabilidad.color }}14;">
  <div style="flex-shrink:0;width:10px;height:10px;border-radius:50%;margin-top:5px;background:{{ operabilidad.color }};box-shadow:0 0 10px {{ operabilidad.color }}88;"></div>
  <div style="flex:1;min-width:0;">
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;">
      <span style="font-size:0.72rem;font-weight:700;letter-spacing:0.06em;color:{{ operabilidad.color }};font-family:'Segoe UI',system-ui,sans-serif;">¿PUEDO OPERAR HOY?</span>
      <span style="font-size:0.95rem;font-weight:700;color:{{ operabilidad.color }};font-family:'Segoe UI',system-ui,sans-serif;">{{ operabilidad.label }}</span>
    </div>
    <p style="margin:4px 0 0;font-size:0.82rem;color:#cbd5e1;line-height:1.4;font-family:'Segoe UI',system-ui,sans-serif;">{{ operabilidad.resumen }}</p>
    {% if operabilidad.motivos %}
    <ul style="margin:6px 0 0;padding-left:18px;color:#94a3b8;font-size:0.75rem;line-height:1.45;font-family:'Segoe UI',system-ui,sans-serif;">
      {% for m in operabilidad.motivos %}<li>{{ m }}</li>{% endfor %}
    </ul>
    {% endif %}
  </div>
</div>
{% endif %}
