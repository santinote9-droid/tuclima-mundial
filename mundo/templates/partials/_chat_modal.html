{% comment %}
  Modal shell para TuClima IA en páginas PRO.
  Incluir UNA vez por página. El markup del chat (.chat-container + #chart-container)
  debe ir DENTRO de #tc-chat-modal-panel.
  Uso del botón: onclick="tcOpenChatModal()"
{% endcomment %}
<style>
  .tc-chat-modal {
    position: fixed;
    inset: 0;
    z-index: 12000;
    display: none;
    align-items: stretch;
    justify-content: stretch;
    padding: 0;
  }
  .tc-chat-modal.is-open { display: flex; }
  .tc-chat-modal-backdrop {
    position: absolute;
    inset: 0;
    background: #020617;
  }
  .tc-chat-modal-panel {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    display: flex;
    flex-direction: column;
    background: #0f172a;
    animation: tcChatModalIn 0.2s ease-out;
  }
  @keyframes tcChatModalIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .tc-chat-modal-panel > .chat-container {
    flex: 1 1 auto;
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    max-height: none !important;
    border-radius: 0 !important;
    border: none !important;
    box-shadow: none !important;
  }
  .tc-chat-modal-panel > #chart-container {
    flex: 0 0 auto;
    margin: 0 !important;
    max-height: 40%;
    border-radius: 0 !important;
    border-left: none !important;
    border-right: none !important;
  }
  .tc-chat-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 5;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(71, 85, 105, 0.5);
    background: rgba(15, 23, 42, 0.95);
    color: #94a3b8;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
  }
  .tc-chat-modal-close:hover {
    color: #f1f5f9;
    border-color: #64748b;
    background: #1e293b;
  }
  #tc-btn-chat.tc-chat-open {
    border-color: #818cf8 !important;
    color: #a5b4fc !important;
    background: rgba(99, 102, 241, 0.12) !important;
  }
  body.tc-chat-modal-open { overflow: hidden; }
</style>
<script>
(function () {
  function panel() { return document.getElementById('tc-chat-modal'); }
  function btn() { return document.getElementById('tc-btn-chat'); }

  window.tcOpenChatModal = function () {
    var m = panel();
    if (!m) return;
    m.classList.add('is-open');
    m.setAttribute('aria-hidden', 'false');
    document.body.classList.add('tc-chat-modal-open');
    var b = btn();
    if (b) b.classList.add('tc-chat-open');
    setTimeout(function () {
      var inp = document.getElementById('user-input');
      if (inp) inp.focus();
      var box = document.getElementById('chat-box');
      if (box) box.scrollTop = box.scrollHeight;
    }, 80);
  };

  window.tcCloseChatModal = function () {
    var m = panel();
    if (!m) return;
    m.classList.remove('is-open');
    m.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('tc-chat-modal-open');
    var b = btn();
    if (b) b.classList.remove('tc-chat-open');
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var m = panel();
      if (m && m.classList.contains('is-open')) window.tcCloseChatModal();
    }
  });

  // Si se abre el gráfico, asegurar que el modal del chat esté visible
  window.addEventListener('load', function () {
    if (typeof window.toggleChart !== 'function') return;
    var _orig = window.toggleChart;
    window.toggleChart = function (forceShow) {
      var m = panel();
      if (m && !m.classList.contains('is-open')) window.tcOpenChatModal();
      return _orig.apply(this, arguments);
    };
  });
})();
</script>
